<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perle sur iPhone Duo, prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --bg-top:#26343a; --bg-bottom:#070c0e; --ink:#E8F1F0; --ink-soft:#9DB5B5;
  --panel:rgba(10,24,28,.78); --line:rgba(232,241,240,.15); --accent:#7FE0D0; --danger:#FF9C8A; --gold:#E8BE5A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg-top:#dfe7e6; --bg-bottom:#9fb1b1; --ink:#10262b; --ink-soft:#3f5a5e;
    --panel:rgba(245,250,249,.84); --line:rgba(16,38,43,.15); --accent:#0F6F6A; --danger:#B4473A; --gold:#9A6B12;
  }
}
:root[data-theme="light"]{
  --bg-top:#dfe7e6; --bg-bottom:#9fb1b1; --ink:#10262b; --ink-soft:#3f5a5e;
  --panel:rgba(245,250,249,.84); --line:rgba(16,38,43,.15); --accent:#0F6F6A; --danger:#B4473A; --gold:#9A6B12;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);background:radial-gradient(120% 90% at 50% 25%,var(--bg-top) 0%,var(--bg-bottom) 100%);
  font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,#scene:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 0;
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.hud>*{pointer-events:auto}
.title{font-family:"Young Serif",Georgia,serif;font-size:1.7rem;line-height:1.05;margin:0;font-weight:400}
.sub{margin:6px 0 0;color:var(--ink-soft);font-size:.9rem;max-width:30ch;line-height:1.4}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:52%}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-weight:600;font-size:.85rem;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:7px}
.swatch{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.hint{font-size:.95rem;text-align:center;max-width:44ch;line-height:1.4;color:var(--ink);margin:0;transition:opacity .4s}
.gauge{pointer-events:auto;width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:baseline;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.g-angle{font-family:"Young Serif",Georgia,serif;font-size:1.45rem;font-variant-numeric:tabular-nums}
.g-angle small{font-family:"Figtree",sans-serif;font-size:.8rem;color:var(--ink-soft);margin-left:6px}
.g-state{font-size:.84rem;color:var(--ink-soft);text-align:right}
.g-state.warn{color:var(--danger);font-weight:600}
.speed{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.speed i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px}
.speed i.hot{background:var(--danger)}
.toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-50%);opacity:0;background:var(--panel);border:1px solid var(--line);
  padding:9px 16px;border-radius:12px;font-weight:600;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);margin-bottom:10px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 15px;font-weight:600;font-size:.88rem;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg-bottom)}
.speed i.gold{background:var(--gold)}
#prankBtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip select,.chip input{font:inherit;color:inherit;background:transparent;border:0;border-bottom:1px solid var(--line);padding:2px 2px;max-width:17ch}
.chip select option{color:#10262b}
.chip input:focus-visible,.chip select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
@media (max-width:560px){.actions{max-width:60%}.title{font-size:1.4rem}.sub{display:none}}
</style>
</head>
<body>
<canvas id="scene" tabindex="0" aria-label="iPhone Duo en 3D. Fais glisser l'iPhone vers la gauche, ou maintiens la flèche haut, pour l'ouvrir."></canvas>

<header class="hud">
  <div>
    <div class="seg" role="group" aria-label="Choix du jeu"><button id="gHuitre" aria-pressed="true">Huître</button><button id="gEcrin" aria-pressed="false">Écrin</button><button id="gDemande" aria-pressed="false">Demande</button></div>
    <h1 class="title" id="title">Perle sur iPhone Duo</h1>
    <p class="sub" id="sub">L'huître s'ouvre en même temps que l'iPhone. Referme-le pour passer à la suivante.</p>
  </div>
  <div class="actions">
    <button class="chip" id="prankBtn" aria-pressed="false" hidden>Fausse demande</button>
    <label class="chip" id="ringPick" hidden>Bague <select id="ringSel"><option value="bonbon">Bonbon</option><option value="foraine">Fête foraine</option><option value="verdit">Qui verdit</option><option value="solitaire">Solitaire (vraie demande)</option></select></label>
    <label class="chip" id="msgPick" hidden>Message <input id="msgIn" maxlength="40" value="Veux-tu m'épouser ?"></label>
    <button class="chip" id="povBtn" hidden>Vue du farceur</button>
    <button class="chip" id="colorBtn" aria-label="Changer de coloris"><span class="swatch" id="swatch"></span><span id="colorName">Night Sky</span></button>
    <button class="chip" id="muteBtn" aria-pressed="false">Son activé</button>
    <button class="chip" id="viewBtn">Recentrer</button>
  </div>
</header>

<div class="dock">
  <p class="hint" id="hint">Attrape l'iPhone et tire vers la gauche pour l'ouvrir. Fais glisser à côté pour tourner autour.</p>
  <div class="gauge">
    <span class="g-angle" id="gAngle">0°<small>charnière</small></span>
    <span class="g-state" id="gState">Fermé, aimants engagés</span>
    <div class="speed" title="Vitesse d'ouverture"><i id="gSpeed"></i></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
/* =================== Données du jeu =================== */
const RARITIES=[
 {id:'vide',name:'Huître vide',tier:0,p:12,color:'#5b6b6b',glow:null,value:0,size:[0,0],flavor:"Rien. Elle te regarde, tu la regardes."},
 {id:'blanche',name:'Perle blanche',tier:1,p:40,color:'#F3F0EA',glow:'#fff1d6',value:10,size:[5,7.5],flavor:"La classique. Ronde, sage, impeccable."},
 {id:'rosee',name:'Perle rosée',tier:1,p:22,color:'#F2C4CC',glow:'#ffb3c6',value:18,size:[6,8.5],flavor:"Un reflet rose qu'on ne voit qu'à la bonne lumière."},
 {id:'baroque',name:'Perle baroque',tier:2,p:12,color:'#C9C4D8',glow:'#c9bcff',value:30,size:[7,11],flavor:"Bosselée et unique. Personne n'en a une pareille."},
 {id:'noire',name:'Perle noire',tier:3,p:8,color:'#33374a',glow:'#7f8cff',value:60,size:[9,13],flavor:"Reflets aubergine et vert paon. Les connaisseurs se taisent."},
 {id:'doree',name:'Perle dorée',tier:4,p:4.5,color:'#E2B04A',glow:'#ffc845',value:120,size:[10,14],flavor:"Elle chauffe un peu la paume. Sûrement une impression."},
 {id:'geante',name:'Perle géante',tier:5,p:1.2,color:'#F6F2FF',glow:'#aef4ff',value:300,size:[18,26],flavor:"L'huître n'a pas fermé l'œil depuis des années."},
 {id:'maudite',name:'Perle maudite',tier:5,p:0.3,color:'#3a0f2a',glow:'#ff2f72',value:666,size:[13,13],flavor:"Elle était là avant l'huître."}
];
const RAR_LABEL=['','◆','◆◆','◆◆◆','★','★★'];
const PITY=25, DAILY=5, RESIST=12, FRAG=[20,110], REVEAL=150, CRACK=300;
const KEY='perle-duo-v1';
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEYS={huitre:KEY,ecrin:'ecrin-duo-v1'};
function loadState(k){let s={left:DAILY,coll:{},treasure:0,pity:0,opened:0,serial:0};try{const raw=localStorage.getItem(k);if(raw)s=Object.assign(s,JSON.parse(raw));}catch(e){}if(s.left<=0)s.left=DAILY;return s;}
const STATES={huitre:loadState(KEYS.huitre),ecrin:loadState(KEYS.ecrin)};
let game='huitre',S=STATES.huitre;
const save=()=>{try{localStorage.setItem(KEYS[game],JSON.stringify(S));}catch(e){}};
function roll(){
  let pool=RARITIES; if(S.pity>=PITY-1) pool=RARITIES.filter(r=>r.tier>=4);
  let x=Math.random()*pool.reduce((a,r)=>a+r.p,0);
  for(const r of pool){if((x-=r.p)<=0)return r;} return pool[pool.length-1];
}
const smooth=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t);};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function hexRGB(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const rgba=(h,a)=>{const c=hexRGB(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';};
const shade=(h,k)=>{const c=hexRGB(h).map(v=>Math.round(v*(1-k)));return 'rgb('+c.join(',')+')';};
function seeded(s){s=Math.floor(s)%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647,(s-1)/2147483646);}

/* =================== Audio =================== */
let actx=null,muted=false;
function ensureAudio(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();}
function noise(dur,freq,gain){
  if(!actx||muted)return;
  const len=Math.max(1,Math.floor(actx.sampleRate*dur)),b=actx.createBuffer(1,len,actx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const s=actx.createBufferSource();s.buffer=b;const f=actx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=2.5;
  const g=actx.createGain();g.gain.value=gain;s.connect(f);f.connect(g);g.connect(actx.destination);s.start();
}
function chime(r){
  if(!actx||muted)return;
  const notes=r.id==='maudite'?[220,233,311,207]:r.tier===0?[330,262]:[523,659,784,988,1175,1568].slice(0,2+r.tier);
  notes.forEach((fq,i)=>{const o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime+i*0.09;
    o.type=r.id==='maudite'?'sawtooth':'sine';o.frequency.value=fq;g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(r.id==='maudite'?0.05:0.12,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.9);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+1);});
}
document.getElementById('muteBtn').addEventListener('click',e=>{muted=!muted;e.currentTarget.textContent=muted?'Son coupé':'Son activé';e.currentTarget.setAttribute('aria-pressed',String(muted));});
const toastEl=document.getElementById('toast');
function toast(t){toastEl.textContent=t;toastEl.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toastEl.classList.remove('show'),2200);}

/* =================== Écrans (canvas 2D) =================== */
const IW=1420, IH=1000, HW=IW/2;          // écran intérieur 7,6" (ratio ~1,42)
const CW=560, CH=811;                     // écran extérieur 5,4" (ratio ~0,69)
const inner=document.createElement('canvas');inner.width=IW;inner.height=IH;const ic=inner.getContext('2d');
const cover=document.createElement('canvas');cover.width=CW;cover.height=CH;const cc=cover.getContext('2d');
const SERIF='"Young Serif", Georgia, serif', SANS='"Figtree", system-ui, sans-serif';

function shellPoly(ax,ay,ang,L,ph,frill){
  const pts=[],N=110,ca=Math.cos(ang),sa=Math.sin(ang);
  for(let i=0;i<=N;i++){
    const f=-1.42+2.84*i/N;
    let r=L*Math.pow(Math.cos(f),0.55)*(1+0.06*Math.sin(f*3+ph[0])+0.04*Math.sin(f*7+ph[1]));
    if(frill) r*=1+frill*Math.sin(f*38+ph[2])*Math.pow(Math.cos(f),0.3);
    const x=Math.cos(f)*r,y=Math.sin(f)*r*1.05;
    pts.push([ax+x*ca-y*sa,ay+x*sa+y*ca]);
  }
  return pts;
}
function polyPath(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();}
function drawShellExterior(c,ax,ay,ang,L,ph){
  const bands=['#3a322b','#57493c','#2e2722','#6a5a49','#433931','#7a6a57','#3b332c'];
  for(let k=0;k<bands.length;k++){
    polyPath(c,shellPoly(ax,ay,ang,L*(1-k*0.085),[ph[0]+k*0.2,ph[1],ph[2]+k],0.045-k*0.004));
    c.fillStyle=bands[k];c.fill();
    c.lineWidth=2;c.strokeStyle='rgba(220,200,170,.10)';c.stroke();
  }
}
function drawNacre(c,ax,ay,ang,L,ph,t){
  const pts=shellPoly(ax,ay,ang,L,ph,0);
  c.save();polyPath(c,pts);c.clip();
  const cx=ax+Math.cos(ang)*L*0.5, cy=ay+Math.sin(ang)*L*0.5;
  const g=c.createRadialGradient(cx,cy,L*0.05,cx,cy,L*0.85);
  g.addColorStop(0,'#fdfaff');g.addColorStop(0.5,'#e7ddf2');g.addColorStop(1,'#a99fbd');
  c.fillStyle=g;c.fillRect(cx-L,cy-L,L*2,L*2);
  if(c.createConicGradient){
    const k=c.createConicGradient(t*0.15+ph[0],cx,cy);
    ['#ffd1e8','#c9f2ff','#fff2c4','#d9ccff','#c4ffe9','#ffd1e8'].forEach((col,i,a)=>k.addColorStop(i/(a.length-1),col));
    c.globalAlpha=0.32;c.fillStyle=k;c.fillRect(cx-L,cy-L,L*2,L*2);c.globalAlpha=1;
  }
  for(let i=0;i<6;i++){ // stries de nacre
    c.beginPath();c.ellipse(ax,ay,L*(0.35+i*0.11),L*(0.3+i*0.1),ang,-1.2,1.2);
    c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=6;c.stroke();
  }
  c.restore();
}
let valves=null;
function makeValves(seed){
  const rnd=seeded(seed*1e6+7),ph=[rnd()*6.3,rnd()*6.3,rnd()*6.3],L=HW*0.86,ay=IH/2;
  const mk=()=>{const cv=document.createElement('canvas');cv.width=HW;cv.height=IH;return cv;};
  const right=mk(),r=right.getContext('2d');
  drawShellExterior(r,0,ay,0,L,ph);
  const left=mk(),l=left.getContext('2d');
  drawShellExterior(l,HW,ay,Math.PI,L*0.96,[ph[1],ph[0],ph[2]+1]);
  // chair de l'huître
  const fx=L*0.5,fy=ay,rx=L*0.34,ry=L*0.37;
  const flesh=(c)=>{
    c.beginPath();for(let i=0;i<=140;i++){const a=i/140*Math.PI*2,w=1+0.022*Math.sin(a*24+ph[2])+0.035*Math.sin(a*5);c.lineTo(fx+Math.cos(a)*rx*w,fy+Math.sin(a)*ry*w);}c.closePath();
    const g=c.createRadialGradient(fx-rx*0.2,fy-ry*0.2,rx*0.1,fx,fy,rx*1.1);g.addColorStop(0,'#f4e8d2');g.addColorStop(0.7,'#d8c3a0');g.addColorStop(1,'#a88f6d');
    c.fillStyle=g;c.fill();c.lineWidth=6;c.strokeStyle='rgba(98,80,64,.55)';c.stroke();
    for(let k=1;k<4;k++){c.beginPath();c.ellipse(fx-rx*0.1,fy,rx*(0.45+k*0.14),ry*(0.5+k*0.13),0,-1.1,1.1);c.strokeStyle='rgba(120,95,70,.22)';c.lineWidth=4;c.stroke();}
  };
  valves={left,right,ph,L,seed,flesh};
}
function drawPearl(c,x,y,rad,r,cracked){
  if(r.tier===0){c.fillStyle='rgba(110,92,74,.7)';c.beginPath();c.arc(x+rad*0.4,y+rad*0.2,rad*0.13,0,7);c.fill();return;}
  c.save();
  const sh=c.createRadialGradient(x+rad*.2,y+rad*.3,rad*.2,x+rad*.2,y+rad*.3,rad*1.35);
  sh.addColorStop(0,'rgba(60,40,30,.45)');sh.addColorStop(1,'rgba(60,40,30,0)');c.fillStyle=sh;c.fillRect(x-rad*2,y-rad*2,rad*4,rad*4);
  c.beginPath();
  if(r.id==='baroque'){for(let i=0;i<=48;i++){const a=i/48*Math.PI*2,k=1+0.12*Math.sin(a*3+1)+0.07*Math.sin(a*5+2);c.lineTo(x+Math.cos(a)*rad*k,y+Math.sin(a)*rad*k*1.08);}c.closePath();}
  else c.arc(x,y,rad,0,Math.PI*2);
  const g=c.createRadialGradient(x-rad*.35,y-rad*.4,rad*.05,x,y,rad*1.08);
  g.addColorStop(0,'#ffffff');g.addColorStop(0.28,r.color);g.addColorStop(1,shade(r.color,0.5));
  c.fillStyle=g;c.fill();
  c.globalAlpha=0.35;c.strokeStyle=r.glow;c.lineWidth=rad*0.08;c.stroke();c.globalAlpha=1;
  c.beginPath();c.ellipse(x-rad*.35,y-rad*.42,rad*.22,rad*.13,-0.6,0,7);c.fillStyle='rgba(255,255,255,.85)';c.fill();
  if(cracked){c.beginPath();c.moveTo(x-rad*.1,y-rad*.9);c.lineTo(x+rad*.12,y-rad*.3);c.lineTo(x-rad*.08,y+rad*.1);c.lineTo(x+rad*.2,y+rad*.7);
    c.moveTo(x+rad*.12,y-rad*.3);c.lineTo(x+rad*.55,y-rad*.15);c.strokeStyle='rgba(40,24,20,.85)';c.lineWidth=rad*0.05;c.stroke();}
  c.restore();
}
function drawGlow(c,x,y,rad,col,a){
  if(!col||a<=0.001)return;
  c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,y,0,x,y,rad);
  g.addColorStop(0,rgba(col,a));g.addColorStop(0.4,rgba(col,a*0.35));g.addColorStop(1,rgba(col,0));c.fillStyle=g;c.fillRect(x-rad,y-rad,rad*2,rad*2);c.restore();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function wrap(c,txt,x,y,maxW,lh){const words=txt.split(' ');let line='';for(const w of words){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,y);line=w;y+=lh;}else line=t;}if(line)c.fillText(line,x,y);}
const FRAMES={0:['#c9cfcf','#7d8889'],1:['#f1edf4','#bdb5c9'],2:['#e6defa','#a698cf'],3:['#5b5f86','#1d2033'],4:['#f7dc8c','#b07d1c'],5:['#ffd6f0','#7fd6ff']};
function drawCard(c,cx,cy,s,o,t){
  const ch=780*s,cw=ch*63/88,x=cx-cw/2,y=cy-ch/2,dark=o.dark,fr=o.frame;
  c.save();
  c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=40*s;c.shadowOffsetY=16*s;
  rr(c,x,y,cw,ch,30*s);const g=c.createLinearGradient(x,y,x+cw,y+ch);g.addColorStop(0,fr[0]);g.addColorStop(1,fr[1]);c.fillStyle=g;c.fill();
  c.shadowColor='transparent';c.save();rr(c,x,y,cw,ch,30*s);c.clip();
  const ink=dark?'#eef0ff':'#1b2326';
  c.fillStyle=ink;c.font=(42*s)+'px '+SERIF;c.textBaseline='alphabetic';c.textAlign='left';

    else if(h>FRAG[0]&&h<FRAG[1])msg=vel>CRACK*0.6?'Trop vite !':'Zone fragile';
    else if(h>=FRAG[1])msg='Encore un peu…';
    c.font='600 42px '+SANS;c.textAlign='center';c.fillStyle=cracked||msg==='Trop vite !'?'#ff9c8a':'rgba(232,241,240,.9)';c.fillText(msg,HW/2,IH-60);
  }else{
    drawPearl(c,px,py,prad,r,revealInfo.cracked);
    c.fillStyle='rgba(0,6,8,.55)';c.fillRect(0,0,IW,IH);
    drawGlow(c,HW*1.5,IH/2,520,r.glow,0.35*pulse);
    cardT=Math.min(1,cardT+frameDt*1.6);
    const e=1+2.2*Math.pow(cardT-1,3)+1.2*Math.pow(cardT-1,2);
    drawCard(c,HW*1.5,IH/2,Math.max(0.01,e),oysterCard(r,revealInfo),t);
    // moitié gauche : suite
    c.textAlign='center';c.fillStyle='rgba(232,241,240,.95)';c.font='46px '+SERIF;
    wrap(c,'Referme l\'iPhone',HW/2,IH*0.42,HW*0.8,56);
    c.font='30px '+SANS;c.fillStyle='rgba(232,241,240,.75)';c.fillText('pour ouvrir l\'huître suivante',HW/2,IH*0.42+52);
    const found=RARITIES.filter(x=>S.coll[x.id]&&S.coll[x.id].n>0).length;
    c.font='600 26px '+SANS;c.fillStyle='rgba(232,241,240,.6)';
    c.fillText('Collection '+found+' sur '+RARITIES.length,HW/2,IH*0.72);c.fillText('Trésor : '+S.treasure+' points',HW/2,IH*0.72+38);
    drawStock(c,HW/2-66,IH*0.84,22,'rgba(232,241,240,.8)');
  }
  innerTex.needsUpdate=true;
}
function drawOysterCover(t,off){
  const c=cc;
  if(off){c.fillStyle='#000';c.fillRect(0,0,CW,CH);coverTex.needsUpdate=true;return;}
  const bg=c.createLinearGradient(0,0,0,CH);bg.addColorStop(0,'#0f3540');bg.addColorStop(1,'#03141a');c.fillStyle=bg;c.fillRect(0,0,CW,CH);
  // barre d'état + Dynamic Island verticale
  const d=new Date();c.fillStyle='rgba(232,241,240,.9)';c.font='600 26px '+SANS;c.textAlign='left';
  c.fillText(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),30,50);
  rr(c,CW-46,26,22,74,11);c.fillStyle='#000';c.fill();
  let jx=0,jy=0;
  if(current.tier>=4&&!reduce){const ph=trembleClock%2.4;if(ph<0.45){jx=(Math.random()-.5)*10;jy=(Math.random()-.5)*6;}}
  drawShellExterior(c,14+jx,CH*0.42+jy,0,CW*0.88,valves.ph); // charnière de l'huître côté charnière de l'iPhone
  c.textAlign='center';c.fillStyle='rgba(232,241,240,.95)';c.font='52px '+SERIF;
  c.fillText(current.tier>=4?'Elle tremble…':'Ouvre-moi',CW/2,CH*0.86);
  c.font='24px '+SANS;c.fillStyle='rgba(232,241,240,.7)';
  c.fillText(S.left+(S.left>1?' huîtres':' huître')+' aujourd\'hui',CW/2,CH*0.86+38);
  if(lastReveal){c.font='22px '+SANS;c.fillStyle='rgba(232,241,240,.5)';c.fillText('Dernière : '+lastReveal.name,CW/2,CH-26);}
  coverTex.needsUpdate=true;
}

/* =================== Caméra & entrées =================== */
let yaw=0.42,pitch=0.2,radius=40;const target=new THREE.Vector3(4,HY*0.78,0),camT=new THREE.Vector3();
function fitDist(hw,hh){const v=THREE.MathUtils.degToRad(camera.fov)/2,hf=Math.atan(Math.tan(v)*camera.aspect);return Math.max(hh/Math.tan(v),hw/Math.tan(hf))*1.22+2;}
function resize(){const w=canvas.clientWidth,hh=canvas.clientHeight;renderer.setSize(w,hh,false);camera.aspect=w/Math.max(1,hh);camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
document.getElementById('viewBtn').addEventListener('click',()=>{yaw=VIEW[game][0];pitch=VIEW[game][1];const pb=document.getElementById('povBtn');if(pb)pb.textContent='Vue du farceur';});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let drag=null,lx=0,ly=0;
function hitPhone(e){const b=canvas.getBoundingClientRect();ndc.set(((e.clientX-b.left)/b.width)*2-1,-((e.clientY-b.top)/b.height)*2+1);ray.setFromCamera(ndc,camera);return ray.intersectObjects(phoneMeshes,false).length>0;}
let downX=0,downY=0,downT=0,moved=0;
canvas.addEventListener('pointerdown',e=>{ensureAudio();drag=hitPhone(e)?'hinge':'orbit';lx=e.clientX;ly=e.clientY;downX=e.clientX;downY=e.clientY;downT=performance.now();moved=0;try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  canvas.style.cursor=drag==='hinge'?'grabbing':'move';document.getElementById('hint').style.opacity='.35';});
canvas.addEventListener('pointermove',e=>{
  if(!drag){canvas.style.cursor=tapTarget(screenPoint(e))?'pointer':hitPhone(e)?'grab':'default';return;}
  moved=Math.max(moved,Math.hypot(e.clientX-downX,e.clientY-downY));
  const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  if(drag==='hinge'){const gain=hTarget<RESIST?0.16:0.5,d=game==='demande'?-dy:-dx;hTarget=clamp(hTarget+d*gain,0,maxH());}
  else{yaw-=dx*0.006;pitch=clamp(pitch+dy*0.004,-0.02,1.1);}
});
const endDrag=(e)=>{if(drag==='hinge'&&e&&e.type==='pointerup'&&moved<8)handleTap(e);if(drag==='hinge'&&hTarget<6)hTarget=0;drag=null;canvas.style.cursor='default';};
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ensureAudio();keyDir=1;e.preventDefault();}else if(e.key==='ArrowDown'||e.key==='ArrowRight'){keyDir=-1;e.preventDefault();}});
const TXT={huitre:{title:'Perle sur iPhone Duo',sub:"L'huître s'ouvre en même temps que l'iPhone. Referme-le pour passer à la suivante.",hint:"Attrape l'iPhone et tire vers la gauche pour l'ouvrir. Fais glisser à côté pour tourner autour.",bar:"Vitesse d'ouverture"},
  demande:{title:'Fausse demande',sub:"Tiens l'iPhone en paysage comme un écrin et soulève le couvercle à moitié pour révéler la bague.",hint:"Tire vers le haut pour soulever le couvercle. Change la bague et le message en haut à droite.",bar:"Ouverture du couvercle"},
  ecrin:{title:'Écrin sur iPhone Duo',sub:"Ouvre l'écrin et arrête-toi pile où le bijou scintille pour un éclat parfait.",hint:"Tire vers la gauche pour ouvrir. Quand ça scintille, ne bouge plus : éclat parfait, valeur ×1,5.",bar:"Éclat"}};
const qLand=new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(new THREE.Vector3(0,0,1),new THREE.Vector3(1,0,0),new THREE.Vector3(0,1,0)));
const qTilt=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0),0.38);
const VIEW={huitre:[0.42,0.2],ecrin:[0.42,0.2],demande:[0,0.62]};
function setPose(gm){if(gm==='demande'){phone.quaternion.copy(qTilt).multiply(qLand);phone.position.set(0,9,0);}else{phone.quaternion.setFromEuler(new THREE.Euler(0,-0.18,0));phone.position.set(0,HY+0.01,0);}
  yaw=VIEW[gm][0];pitch=VIEW[gm][1];$('povBtn').textContent='Vue du farceur';}
function applyGameUI(gm){['huitre','ecrin','demande'].forEach(k=>$('g'+k[0].toUpperCase()+k.slice(1)).setAttribute('aria-pressed',String(gm===k)));
  ['ringPick','msgPick','povBtn'].forEach(id=>$(id).hidden=gm!=='demande');
  $('prankBtn').hidden=true;$('title').textContent=TXT[gm].title;$('sub').textContent=TXT[gm].sub;$('hint').textContent=TXT[gm].hint;$('hint').style.opacity='1';$('gSpeed').parentNode.title=TXT[gm].bar;}
function setGame(gm){if(gm===game)return;game=gm;S=STATES[gm]||S;setPose(gm);hTarget=h=prevH=0;vel=0;lastReveal=null;applyGameUI(gm);spawn();drawCover(0,false);}
$('gHuitre').addEventListener('click',()=>setGame('huitre'));$('gDemande').addEventListener('click',()=>setGame('demande'));
$('ringSel').addEventListener('change',e=>{ringKey=e.target.value;if(game==='demande'){hTarget=0;spawn();}});
$('msgIn').addEventListener('input',e=>{msgText=e.target.value.trim()||DEF_MSG;});
$('povBtn').addEventListener('click',e=>{const back=Math.abs(yaw)<1;yaw=back?Math.PI:0;pitch=back?0.42:0.62;e.currentTarget.textContent=back?'Vue de la personne':'Vue du farceur';});$('gEcrin').addEventListener('click',()=>setGame('ecrin'));
$('prankBtn').addEventListener('click',e=>{prank=!prank;e.currentTarget.setAttribute('aria-pressed',String(prank));
  toast(prank?'Fausse demande activée : le prochain écrin cache une bague bonbon':'Fausse demande désactivée');
  if(h<1&&mode==='armed')spawn();coverClock=1;});
window.addEventListener('keyup',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){keyDir=0;if(hTarget<6)hTarget=0;}});

/* =================== Boucle =================== */
const ui={angle:document.getElementById('gAngle'),state:document.getElementById('gState'),speed:document.getElementById('gSpeed')};
const vL=new THREE.Vector3(),vR=new THREE.Vector3(),mid=new THREE.Vector3(),tmpC=new THREE.Color();
let last=performance.now(),t0=last;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;frameDt=dt;const t=(now-t0)/1000;
  if(keyDir)hTarget=clamp(hTarget+keyDir*(hTarget<RESIST?25:70)*dt,0,maxH());
  h+=(hTarget-h)*(1-Math.exp(-dt*16));
  if(Math.abs(hTarget-h)<0.01)h=hTarget;
  const dv=(h-prevH)/Math.max(dt,1e-4);
  if(prevH>1.2&&h<=1.2){noise(0.07,1500,1.0);shakeT=0.18;} // clic magnétique à la fermeture
  if(!popped&&h>=RESIST){popped=true;noise(0.09,900,0.7);shakeT=0.12;}
  if(h<RESIST-3)popped=false;
  if(h<RESIST&&h>0.6&&Math.abs(h-lastTick)>1.7&&dv>0){noise(0.03,2600,0.2);lastTick=h;}
  prevH=h;vel+=(Math.max(0,dv)-vel)*0.3;

  if(game==='demande'){demandeTick(t);}
  else if(mode==='armed'){
    if(game==='ecrin')ecrinTick(dt,dv);
    else if(!cracked&&current.tier>0&&h>FRAG[0]&&h<FRAG[1]&&vel>CRACK)crack();
    if(h>=REVEAL)reveal();
  }else if(h<1.5){spawn();}

  // Charnière
  const hr=THREE.MathUtils.degToRad(h);
  pivot.rotation.y=Math.PI-hr;
  const k=h/180;spine.scale.set(THREE.MathUtils.lerp(0.57,0.27,k),1,THREE.MathUtils.lerp(0.57,0.27,k));
  {const rs=THREE.MathUtils.lerp(0.57,0.27,k);spine.position.set(0,0,-rs*smooth(0,35,h));}
  // Vibration (rareté ou impact)
  let jx=0;
  if(game!=='demande'&&mode==='armed'&&current.tier>=4&&h<3&&!reduce){trembleClock+=dt;const ph=trembleClock%2.4;if(ph<0.45)jx=(Math.random()-.5)*0.06;}
  if(shakeT>0){shakeT-=dt;jx+=(Math.random()-.5)*0.12*shakeT*4;}
  phone.position.x=jx;

  // Écrans
  if(h>0.8)drawInner(t);
  coverClock+=dt;
  if(game==='demande'){if(coverClock>1/20){drawCover(t,h>=35);coverClock=0;}}
  else if(h<35){if(coverClock>1/30){drawCover(t,false);coverClock=0;}}
  else if(coverClock<900){drawCover(t,true);coverClock=1000;}

  // Lumières émises par l'écran intérieur
  vR.set(HALF_W/2,0,0.6);vL.set(-HALF_W/2,0,0.6).applyAxisAngle(new THREE.Vector3(0,1,0),pivot.rotation.y);
  mid.copy(vR).add(vL).multiplyScalar(0.5);phone.localToWorld(mid);
  const open=smooth(1,90,h);
  screenLight.position.copy(mid).add(new THREE.Vector3(0,0,1.5));
  screenLight.intensity=open*1.6;
  const g=current.glow;
  if(game==='demande'){pearlLight.color.set(g);pearlLight.intensity=smooth(15,80,h)*(current.tier>=4?2.2:1.3);}
  else if(g&&mode==='armed'&&game==='ecrin'){pearlLight.color.set(g);pearlLight.intensity=smooth(1,25,h)*(0.25+1.6*(perfect?1:closeness))*(0.7+current.tier*0.2);}
  else if(g&&mode==='armed'){pearlLight.color.set(g);pearlLight.intensity=smooth(1,25,h)*(0.6+current.tier*0.35)*(cracked?0.4:1)*(current.id==='maudite'?0.7+0.3*Math.sin(t*6):1)*2;}
  else if(g){pearlLight.color.set(g);pearlLight.intensity=1.2;}else pearlLight.intensity=0;
  vR.set(HALF_W*0.75,0,0.4);phone.localToWorld(vR);pearlLight.position.copy(vR);

  // Ombre et caméra
  const cx=4.115*(1+Math.cos(hr))/2, cz=4.115*Math.sin(hr)/2;
  const c3=new THREE.Vector3(cx,0,cz);phone.localToWorld(c3);
  shadow.position.set(c3.x,0.02,c3.z);shadow.scale.set(12+10*k,4+3*Math.sin(hr),1);
  target.lerp(new THREE.Vector3(c3.x,game==='demande'?c3.y-1.6:HY*0.78,c3.z),1-Math.exp(-dt*4));
  const want=game==='demande'?fitDist(10.5,9):THREE.MathUtils.lerp(fitDist(5.6,7.6),fitDist(10.2,7.6),smooth(0,150,h));
  radius+=(want-radius)*(1-Math.exp(-dt*3));
  const sway=reduce?0:Math.sin(t*0.25)*0.03;
  camT.set(Math.sin(yaw+sway)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw+sway)*Math.cos(pitch)).multiplyScalar(radius).add(target);
  camera.position.copy(camT);camera.lookAt(target);

  // Jauge HTML
  ui.angle.innerHTML=Math.round(h)+'°<small>charnière</small>';
  let st,warn=false;
  if(game==='demande'){
    const r=RINGS[ringKey];ui.speed.classList.remove('hot');ui.speed.classList.add('gold');ui.speed.style.width=(smooth(0,75,h)*100).toFixed(0)+'%';
    if(h<0.8)st='Écrin fermé';else if(dem.revealAt===null)st='Couvercle en train de s\'ouvrir';
    else if(!r.prank)st='Bague révélée';else st=dem.punch?'Chute envoyée':'La chute arrive…';
  }else if(game==='ecrin'){
    const fill=perfect?1:Math.max(closeness*0.6,holdT/0.9);
    ui.speed.style.width=(fill*100).toFixed(0)+'%';ui.speed.classList.remove('hot');ui.speed.classList.add('gold');
    if(mode==='revealed')st=h>=REVEAL?'Révélé. Referme pour le suivant':'Referme pour le suivant';
    else if(h<0.8)st=prank?'Fermé, demande prête':'Fermé';
    else if(h<RESIST)st='Le fermoir résiste';
    else if(current.prank)st='Fausse demande en cours';
    else if(perfect)st='Éclat parfait';
    else if(h>20&&h<140)st=closeness>0.75?'Ça scintille, ne bouge plus':"Cherche l'angle d'éclat";
    else st=h<REVEAL?'Encore un peu':'Ouvert';
  }else{
    ui.speed.classList.remove('gold');
  const ratio=Math.min(1,vel/CRACK),inF=h>FRAG[0]&&h<FRAG[1];
    ui.speed.style.width=(ratio*100).toFixed(0)+'%';ui.speed.classList.toggle('hot',inF&&ratio>0.6&&mode==='armed');
    if(mode==='revealed')st=h>=REVEAL?'Révélée. Referme pour la suivante':'Referme pour la suivante';
    else if(h<0.8)st='Fermé, aimants engagés';
    else if(h<RESIST)st='Les aimants retiennent la coque';
    else if(inF){st=cracked?'Perle fêlée':'Zone fragile, doucement';warn=!cracked&&ratio>0.5;}
    else if(h<REVEAL)st=cracked?'Perle fêlée':'Encore un peu';
    else st='Ouverte';
  }
  ui.state.textContent=st;ui.state.classList.toggle('warn',warn);

  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
function start(){resize();const qg=new URLSearchParams(location.search).get('game');if(qg==='ecrin'||qg==='demande'){game=qg;S=STATES[qg]||S;applyGameUI(qg);setPose(qg);}spawn();
  const q=parseFloat(new URLSearchParams(location.search).get('h'));if(q>0){hTarget=h=prevH=clamp(q,0,180);if(h>=REVEAL)reveal();}drawInner(0);drawCover(0,false);radius=fitDist(5.6,7.6);requestAnimationFrame(frame);}
if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('40px "Young Serif"'),document.fonts.load('600 30px "Figtree"')]).catch(()=>{}).then(start);}else start();
})();
</script>
</body>
