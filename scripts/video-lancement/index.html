<style>
:root{--gold1:#FFF1C1;--gold2:#F7CB5C;--gold3:#C98B1E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#04161f}
body{font-family:Figtree,system-ui,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0}
#bg{background:radial-gradient(120% 70% at 50% 0%,#1d6f7c 0%,#0b3b4a 38%,#05202b 70%,#030f15 100%)}
#tint{mix-blend-mode:soft-light;opacity:0}
#rays{inset:-300px -400px auto -400px;height:2300px;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 90px,rgba(190,255,250,.07) 90px 150px,rgba(255,255,255,0) 150px 260px,rgba(190,255,250,.045) 260px 300px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 85%);filter:blur(5px)}
#motes i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(220,255,250,.9),rgba(220,255,250,0) 70%)}
#spot{background:radial-gradient(50% 35% at 50% 58%,rgba(255,255,255,.16),rgba(255,255,255,0) 70%)}

/* Téléphone (iPhone classique) */
.phone{position:absolute;left:50%;top:50%;--w:700px;width:calc(var(--w) + 44px);padding:22px;border-radius:calc(var(--w)*.137 + 22px);
  background:linear-gradient(145deg,#5b6068 0%,#1d1f23 18%,#0b0c0e 50%,#2a2d33 82%,#6b7078 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.12) inset,0 60px 140px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.4);transform-origin:50% 50%;will-change:transform}
.phone .scr{position:relative;width:var(--w);aspect-ratio:1206/2622;border-radius:calc(var(--w)*.137);overflow:hidden;background:#000}
.phone .scr img{width:100%;height:100%;display:block}
.phone .scr img.ui{position:absolute;inset:0}
.phone .glare{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,rgba(255,255,255,.0) 35%,rgba(255,255,255,.10) 45%,rgba(255,255,255,0) 55%);pointer-events:none}
.touch{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:5px solid rgba(255,255,255,.95);
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,.12) 60%,rgba(255,255,255,0) 72%);box-shadow:0 0 40px rgba(255,255,255,.6);opacity:0}

  color:var(--gold2);padding:14px 34px;border-radius:999px;background:rgba(255,215,120,.10);border:2px solid rgba(255,215,120,.38);backdrop-filter:blur(10px)}

.r{background:linear-gradient(180deg,#ffd0de 0%,#ff4f86 50%,#b3123f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(255,40,100,.45))}

  return sh;}
// Une carte filmée (t : secondes depuis le début de l'extrait).
const CARDS={golden:140,black:88,find:86,giant:88,cursed:111,ecrin:111,orskin:90,bijoux:216};
function card(i,take,t){setImg($('s'+i),`${A}/c/${take}/${f5(clamp(Math.round(t*60),0,CARDS[take]-1))}.jpg`);setImg($('u'+i),null);}

/* ---------- Décor ---------- */
const motes=[];{const m=$('motes');let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<46;i++){const e=document.createElement('i');const d=6+r()*22;e.style.width=e.style.height=d+'px';m.appendChild(e);motes.push({e,x:r()*1080,y:r()*H,v:20+r()*60,ph:r()*6,d});}}
function decor(t,mood){
  for(const o of motes){const y=((o.y-o.v*t)%2000+2000)%2000-40;o.e.style.transform=`translate(${o.x+Math.sin(t*0.8+o.ph)*24}px,${y}px)`;o.e.style.opacity=(0.25+0.35*Math.sin(t*1.3+o.ph)**2)*mood.motes;}
  $('rays').style.transform=`translateX(${Math.sin(t*0.25)*60}px) skewX(-6deg)`;$('rays').style.opacity=mood.rays;
  $('bg').style.filter=mood.bgFilter||'none';

  $('vignette').style.opacity=mood.vig??1;$('spot').style.opacity=mood.spot??0.6;
}

/* ---------- Texte animé (mot par mot) ---------- */
const cache={};
function words(el,text,cls){const k=el.id;if(cache[k]!==text+cls){cache[k]=text+cls;el.innerHTML=text?text.split(' ').map(w=>`<span class="w ${cls||''}">${w}</span>`).join(' '):'';}
  return [...el.querySelectorAll('.w')];}
function animWords(el,text,cls,t0,t1,t,{stagger=0.07,big=1}={}){
  const ws=words(el,text,cls);
  ws.forEach((w,i)=>{const a=t-t0-i*stagger,k=outBack(a/0.32),o=sm(0,0.12,a)*(1-sm(t1-0.18,t1,t));
    w.style.opacity=o;w.style.transform=`translateY(${(1-k)*70}px) scale(${lerp(1.35*big,1,clamp(k,0,1.2))})`;w.style.filter=`blur(${(1-sm(0,0.22,a))*14}px)`;});
  el.style.display=ws.length?'block':'none';
}
function hideText(){for(const id of ['t1','t2']){$(id).innerHTML='';cache[id]='';}$('sub').style.opacity=0;$('eb').style.opacity=0;}
function sub(text,t0,t1,t){const e=$('sub');e.textContent=text;const a=t-t0;e.style.opacity=sm(0,0.25,a)*(1-sm(t1-0.2,t1,t));e.style.transform=`translateY(${(1-outExpo(a/0.4))*30}px)`;}
function eyebrow(text,t0,t1,t){const e=$('eb');e.textContent=text;const a=t-t0;e.style.opacity=sm(0,0.2,a)*(1-sm(t1-0.2,t1,t));e.style.transform=`scale(${lerp(0.8,1,outBack(a/0.35))})`;}
function chip(text,cls,t0,t1,t,top){const e=$('chip');e.className='chip '+(cls||'');e.textContent=text;const a=t-t0;const k=outBack(a/0.3);
  e.style.top=(SQ?top*0.55:top)+'px';e.style.opacity=sm(0,0.08,a)*(1-sm(t1-0.12,t1,t));e.style.transform=`translateX(-50%) scale(${lerp(0.5,1,k)}) rotate(${(1-clamp(k,0,1))*-8}deg)`;}

/* ---------- Téléphone ---------- */
function phone(id,{x=540,y=1080,w=700,s=1,rx=0,ry=0,rz=0,show=true}={}){const p=$(id);p.style.display=show?'block':'none';if(!show)return;
  if(SQ){w*=0.6;y=y*0.55+400;}  // centre du téléphone vers 720 px (sous les titres), comme en vertical
  p.style.setProperty('--w',w+'px');p.style.transform=`translate(-50%,-50%) translate(${x-540}px,${y-960}px) perspective(2200px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;}
// Le doigt sur l'écran : (x, y) en points de l'iPhone, visibilité o.
function touch(w,x,y,o,trail){if(SQ)w*=0.6;const k=w/402;const to=$('to1'),tr=$('tr1');to.style.left=x*k+'px';to.style.top=y*k+'px';to.style.opacity=o;to.style.transform=`scale(${lerp(1.4,1,o)})`;
  tr.style.left=x*k+'px';tr.style.top=y*k+'px';tr.style.height=Math.max(0,trail*k)+'px';tr.style.opacity=o*0.8;}

/* ---------- iPhone Duo en 3D (modèle de pearl-inc.app) ---------- */
const dc=$('duo');
const renderer=new THREE.WebGLRenderer({canvas:dc,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1080,H,false);renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.0;renderer.setClearColor(0x000000,0);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(20,1080/H,0.5,600);
{const env=new THREE.Scene();const sg=new THREE.SphereGeometry(80,48,24),col=[],p=sg.attributes.position,cl=new THREE.Color();

  panel(60,18,0,60,20,4);panel(16,70,-62,0,10,3);panel(16,70,62,0,-10,2.4);panel(70,12,0,-30,60,1.6);
  panel(8,90,-30,0,-60,0.02);panel(8,90,34,0,55,0.03);panel(90,6,0,-55,-20,0.02);

const HALF_W=8.23,PH=11.78,T=0.52,HY=PH/2,B=0.11;
function rrShape(x0,y0,x1,y1,r){const s=new THREE.Shape();s.moveTo(x0+r[0],y0);s.lineTo(x1-r[1],y0);s.quadraticCurveTo(x1,y0,x1,y0+r[1]);s.lineTo(x1,y1-r[2]);
  s.quadraticCurveTo(x1,y1,x1-r[2],y1);s.lineTo(x0+r[3],y1);s.quadraticCurveTo(x0,y1,x0,y1-r[3]);s.lineTo(x0,y0+r[0]);s.quadraticCurveTo(x0,y0,x0+r[0],y0);return s;}
function setUV(g,fu,fv){const p=g.attributes.position,uv=g.attributes.uv;for(let i=0;i<p.count;i++)uv.setXY(i,fu(p.getX(i)),fv(p.getY(i)));uv.needsUpdate=true;}
const frameMat=new THREE.MeshStandardMaterial({metalness:1,roughness:0.1,color:0xdcdad4});
const backMat=new THREE.MeshPhysicalMaterial({metalness:0.1,roughness:0.42,clearcoat:0.6,clearcoatRoughness:0.35,color:0xefede8});
const hingeMat=new THREE.MeshStandardMaterial({metalness:1,roughness:0.14,color:0xcfccc5});

const lensMat=new THREE.MeshPhysicalMaterial({color:0x08090c,metalness:0.6,roughness:0.04,clearcoat:1});

const phone3=new THREE.Group();scene.add(phone3);
const rightHalf=new THREE.Group();phone3.add(rightHalf);const pivot=new THREE.Group();phone3.add(pivot);const leftHalf=new THREE.Group();pivot.add(leftHalf);
function bodyGeo(x0,x1,roundRight){const R=1.12,r0=0.24;const sh=rrShape(x0+B,-HY+B,x1-B,HY-B,roundRight?[r0-0.1,R-B,R-B,r0-0.1]:[R-B,r0-0.1,r0-0.1,R-B]);
  const g=new THREE.ExtrudeGeometry(sh,{depth:T-2*B,bevelEnabled:true,bevelThickness:B,bevelSize:B,bevelSegments:8,curveSegments:40});g.translate(0,0,-T+B);return g;}
rightHalf.add(new THREE.Mesh(bodyGeo(0,HALF_W,true),frameMat));leftHalf.add(new THREE.Mesh(bodyGeo(-HALF_W,0,false),frameMat));
const innerTex=new THREE.Texture();innerTex.encoding=THREE.sRGBEncoding;innerTex.anisotropy=8;
const coverTex=new THREE.Texture();coverTex.encoding=THREE.sRGBEncoding;coverTex.anisotropy=8;
const innerMat=new THREE.MeshBasicMaterial({map:innerTex,toneMapped:false});const coverMat=new THREE.MeshBasicMaterial({map:coverTex,toneMapped:false});

// Duo : la prise (duo-golden, duo-ecrin), son instant rt, et le cadrage (lacet, tangage, distance relative, décalage vertical).
function duo(show,{name='duo-golden',rt=0,yaw=0,pitch=0.04,zoom=1,dy=0,roll=0}={}){
  dc.style.display=show?'block':'none';if(!show)return;
  const sh=SHOTS[name],n=clamp(Math.round(rt*60),0,sh.frames.length-1),h=sh.frames[n].angle;
  const src=`${A}/s/${name}/${f5(n)}.jpg`;
  if(innerImg.dataset.src!==src){innerImg.dataset.src=src;innerImg.src=src;pending.push(innerImg.decode().then(()=>{innerTex.image=innerImg;innerTex.needsUpdate=true;}).catch(()=>{}));}
  // L'écran extérieur garde la coquille (ou l'écrin) fermée tout au long de l'ouverture : c'est le dessus du couvercle,
  // et c'est le téléphone qui le soulève ; l'intérieur s'allume en s'ouvrant (choix de Jules : jamais d'écran noir).
  innerMat.color.setScalar(sm(4,16,h));
  {const c=`${A}/s/${name}/cover/${f5(n)}.jpg`;if(coverImg.dataset.src!==c){coverImg.dataset.src=c;coverImg.src=c;
    pending.push(coverImg.decode().then(()=>{coverTex.image=coverImg;coverTex.needsUpdate=true;}).catch(()=>{}));}}
  pivot.rotation.y=Math.PI-THREE.MathUtils.degToRad(h);
  const k=sm(0,90,h),spx=lerp(0.3,0.26,k),spz=lerp(0.5,0.26,k);spine.scale.set(spx,1,spz);spine.position.set(0,0,-spz*sm(0,35,h));
  const hr=THREE.MathUtils.degToRad(h),cx=4.115*(1+Math.cos(hr))/2,cz=4.115*Math.sin(hr)/2;
  const tgt=new THREE.Vector3(cx,0.15-(SQ?dy*0.5:dy),cz*0.6);
  const v=THREE.MathUtils.degToRad(camera.fov)/2,hf=Math.atan(Math.tan(v)*camera.aspect);
  const fit=(hw,hh)=>Math.max(hh/Math.tan(v),hw/Math.tan(hf))*1.04;
  const radius=lerp(fit(5.2,10.4),fit(9.2,10.4),sm(0,150,h))*zoom;
  camera.position.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(radius).add(tgt);
  camera.up.set(Math.sin(roll),Math.cos(roll),0);camera.lookAt(tgt);
  return h;
}

function ramp(keys,lt){for(let i=1;i<keys.length;i++)if(lt<=keys[i][0]||i===keys.length-1){const p=keys[i-1],q=keys[i];return lerp(p[1],q[1],clamp((lt-p[0])/(q[0]-p[0]),0,1));}}
