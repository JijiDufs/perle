<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&family=Young+Serif&display=block" rel="stylesheet">
<style>
:root{
  --gold1:#FFF1C1; --gold2:#F7CB5C; --gold3:#C98B1E;
  --ink:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1320px;height:2868px;overflow:hidden;background:#06202b}
body{font-family:Figtree,system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.panel{position:absolute;inset:0;overflow:hidden;display:none}
.panel.on{display:block}

/* ---------- Fonds ---------- */
.bg{position:absolute;inset:0}
.rays{position:absolute;inset:-200px -300px auto -300px;height:2200px;
  background:repeating-linear-gradient(100deg,rgba(255,255,255,0) 0 90px,rgba(190,255,250,.07) 90px 150px,rgba(255,255,255,0) 150px 260px,rgba(190,255,250,.045) 260px 300px);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.6) 45%,transparent 90%);filter:blur(6px);transform:skewX(-6deg)}
.bubbles i{position:absolute;border-radius:50%;border:3px solid rgba(220,255,255,.35);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.spark{position:absolute;width:var(--s,60px);height:var(--s,60px);
  background:radial-gradient(circle,#fff 0 6%,rgba(255,255,255,0) 7%),
  conic-gradient(from 0deg,transparent 0 40deg,transparent 0);
  filter:drop-shadow(0 0 14px var(--c,#ffe39a)) drop-shadow(0 0 30px var(--c,#ffe39a))}
.spark::before,.spark::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:50%;transform:translate(-50%,-50%)}
.spark::before{width:8%;height:100%;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.spark::after{width:100%;height:8%;clip-path:polygon(0 50%,50% 0,100% 50%,50% 100%)}

/* ---------- Texte ---------- */
.copy{position:absolute;left:0;right:0;top:150px;text-align:center;padding:0 80px;z-index:20}
.eyebrow{display:inline-flex;align-items:center;gap:18px;font-weight:800;font-size:40px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold2);padding:16px 34px;border-radius:999px;background:rgba(255,215,120,.10);border:2px solid rgba(255,215,120,.35);margin-bottom:40px}
h1{font-weight:900;font-size:142px;line-height:.98;letter-spacing:-.025em;text-shadow:0 8px 40px rgba(0,0,0,.35)}
h1 .g{background:linear-gradient(180deg,var(--gold1) 0%,var(--gold2) 45%,var(--gold3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.35))}
h1 .s{display:block}
.sub{margin-top:38px;font-size:52px;font-weight:600;line-height:1.25;color:rgba(255,255,255,.86)}

/* ---------- Téléphone ---------- */
.phone{position:absolute;--w:940px;width:calc(var(--w) + 52px);padding:26px;border-radius:calc(var(--w)*.137 + 26px);
  background:linear-gradient(145deg,#5b6068 0%,#1d1f23 18%,#0b0c0e 50%,#2a2d33 82%,#6b7078 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.12) inset,0 60px 120px rgba(0,0,0,.55),0 20px 40px rgba(0,0,0,.4);z-index:10}
.phone .scr{position:relative;width:var(--w);aspect-ratio:1206/2622;border-radius:calc(var(--w)*.137);overflow:hidden;background:#000}
.phone .scr img{width:100%;height:100%;display:block}
.phone .scr::after{content:"";position:absolute;left:50%;top:calc(var(--w)*.035);width:calc(var(--w)*.31);height:calc(var(--w)*.09);transform:translateX(-50%);
  background:#000;border-radius:999px}
.halo{position:absolute;border-radius:50%;filter:blur(40px);z-index:1}

.chip{position:absolute;z-index:30;display:flex;align-items:center;gap:20px;padding:26px 40px;border-radius:999px;font-weight:800;font-size:46px;
  background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 50px rgba(0,0,0,.35);white-space:nowrap}
.chip.gold{background:linear-gradient(180deg,#FFE8A3,#E9B44C);color:#3a2604;border-color:rgba(255,255,255,.6)}
.chip.red{background:linear-gradient(180deg,#ff6b8f,#c81d4f);border-color:rgba(255,255,255,.5)}
.chip.dark{background:rgba(6,25,35,.72)}
.float{position:absolute;z-index:25;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}

/* Geste : le pouce qui glisse */
.swipe{position:absolute;z-index:26;width:150px;transform:translateX(-50%)}
.swipe .trail{position:absolute;left:50%;transform:translateX(-50%);width:34px;border-radius:20px;
  background:linear-gradient(0deg,rgba(255,255,255,.0),rgba(255,255,255,.85));}
.swipe .dot{position:absolute;left:50%;transform:translate(-50%,-50%);width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0 34%,rgba(255,255,255,.35) 36% 60%,rgba(255,255,255,0) 62%);
  box-shadow:0 0 60px rgba(255,240,200,.8)}
.swipe .arrow{position:absolute;left:50%;transform:translateX(-50%);width:0;height:0;border-left:44px solid transparent;border-right:44px solid transparent;border-bottom:56px solid #fff;
  filter:drop-shadow(0 0 20px rgba(255,240,200,.9))}

.traits{position:absolute;left:30px;top:1080px;width:440px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:12}
.traits div{display:flex;flex-direction:column;align-items:center;margin-bottom:22px}
.traits img{width:340px;height:340px;margin:-40px 0 -70px}
.traits span{font-size:42px;font-weight:800;text-align:center;line-height:1.1;padding:14px 26px;border-radius:999px;background:rgba(6,25,35,.6);border:2px solid rgba(255,255,255,.22)}
/* Échelle des raretés */
.ladder{position:absolute;left:80px;right:80px;top:790px;display:flex;flex-direction:column;gap:24px;z-index:10}
.row{display:flex;align-items:center;gap:34px;padding:24px 50px 24px 24px;border-radius:44px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12)}
.row img{width:270px;height:270px;margin:-45px -30px;flex:none}
.row .n{flex:1;font-size:64px;font-weight:800;line-height:1.05}
.row .n small{display:block;font-size:42px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.06em;margin-top:6px}
.row .p{font-size:66px;font-weight:900;font-variant-numeric:tabular-nums}
.row.top{background:linear-gradient(90deg,rgba(255,47,114,.32),rgba(255,47,114,.08));border-color:rgba(255,120,160,.6);box-shadow:0 0 80px rgba(255,47,114,.35)}
.row.top .p{color:#ff8fb0}
.row.gold{background:linear-gradient(90deg,rgba(247,203,92,.22),rgba(247,203,92,.05));border-color:rgba(247,203,92,.45)}
.row.gold .p{color:var(--gold2)}
.note{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-size:46px;font-weight:700;color:rgba(255,255,255,.75);z-index:10}
.note b{color:var(--gold2)}
</style></head>
